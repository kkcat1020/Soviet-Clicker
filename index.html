<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ソビエトクリッカー</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#ffffff;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    color:#000000;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
  }
  .emblem-wrap{
    position:relative;
    width:320px;
    height:180px; /* 16:9 国旗サイズ */
  }
  .main-btn{
    width:100%;
    height:100%;
    border-radius:0;
    border:none;
    padding:0;
    cursor:pointer;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .08s ease;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.25));
  }
  .main-btn img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:0;
    pointer-events:none;
  }
  .main-btn:active{
    transform:scale(.92);
  }
  .counter{
    font-size:2.4rem;
    font-weight:700;
    letter-spacing:.02em;
    color:#000000;
  }
  .pop{
    position:absolute;
    width:56px;
    height:56px;
    border-radius:50%;
    pointer-events:none;
    animation:pop-appear .25s ease-out forwards;
  }
  .pop img{
    width:100%;
    height:100%;
    border-radius:50%;
    display:block;
  }
  @keyframes pop-appear{
    0%{
      transform:scale(0.3);
      opacity:0;
    }
    100%{
      transform:scale(1);
      opacity:1;
    }
  }
  .loading{
    position:fixed;
    inset:0;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    z-index:100;
    transition:opacity .4s ease;
  }
  .loading.hide{
    opacity:0;
    pointer-events:none;
  }
  .loading-percent{
    font-size:2rem;
    font-weight:700;
    color:#000000;
    font-variant-numeric:tabular-nums;
  }
  .loading-bar{
    width:220px;
    height:6px;
    background:#eeeeee;
    border-radius:3px;
    overflow:hidden;
  }
  .loading-bar-fill{
    height:100%;
    width:0%;
    background:#000000;
    transition:width 6s linear;
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-percent" id="loadingPercent">0%</div>
  <div class="loading-bar"><div class="loading-bar-fill" id="loadingFill"></div></div>
</div>

<div class="stage" id="stage">
  <div class="emblem-wrap" id="emblemWrap">
    <button class="main-btn" id="mainBtn" aria-label="クリックする">
      <img id="mainImg" alt="メイン画像">
    </button>
  </div>
  <div class="counter" id="counter">0クリック</div>
</div>

<script>
/* =========================================================
   ▼ ここを書き換えるだけで画像・音を差し替えられます ▼
   ========================================================= */

// 中央に置くメイン画像。自分のJPEGを使う場合はここにファイル名/URLを入れる
// 例: "main.jpg"  (空文字のままなら自動生成の丸が表示されます)
const MAIN_IMAGE_SRC = "03.jpg";

// クリックした時に弾け出る丸の画像。自分のJPEGにしたい場合はここに入れる
// 例: "circle.jpg" (空文字のままなら自動生成の丸が表示されます)
const POP_IMAGE_SRC = "02.png";

// クリック音。MP3ファイルを使う場合はここにファイル名/URLを入れる
// 例: "click.mp3" (空文字のままなら自動生成のクリック音が鳴ります)
const CLICK_SOUND_SRC = "01.mp3";

// 1回のクリックで何個の丸を出すか
const POPS_PER_CLICK = 1;

/* ========================================================= */

// 画像が指定されていない時のためのデフォルト丸画像(軽量SVG)
function defaultCircleDataUri(color1, color2){
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="g" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="${color1}"/>
          <stop offset="100%" stop-color="${color2}"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#g)" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
    </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

const mainImg = document.getElementById("mainImg");
mainImg.src = MAIN_IMAGE_SRC || defaultCircleDataUri("#ffd873", "#e8951f");

const popImgSrc = POP_IMAGE_SRC || defaultCircleDataUri("#ff9a9a", "#e0453f");

// ポップ画像は最初のクリックまで読み込まれないと、1個目だけ一瞬
// 表示が遅れることがあるため、ローディング中に先読みしておく
const preloadPopImg = new Image();
preloadPopImg.src = popImgSrc;

// ---- ローディング画面(7秒でゆっくり0%→100%) ----
// 音声プールの準備やレスポンス調整の時間を確保しつつ、見た目もシンプルに
const LOADING_DURATION_MS = 7000;
const loadingEl = document.getElementById("loading");
const loadingPercentEl = document.getElementById("loadingPercent");
const loadingFillEl = document.getElementById("loadingFill");

requestAnimationFrame(() => {
  loadingFillEl.style.width = "100%"; // CSSのtransition(6s linear)でバーが伸びる
});

const loadingStart = performance.now();
function tickLoading(now){
  const elapsed = now - loadingStart;
  const pct = Math.min(100, Math.floor((elapsed / LOADING_DURATION_MS) * 100));
  loadingPercentEl.textContent = pct + "%";
  if (elapsed < LOADING_DURATION_MS){
    requestAnimationFrame(tickLoading);
  } else {
    loadingPercentEl.textContent = "100%";
    loadingEl.classList.add("hide");
  }
}
requestAnimationFrame(tickLoading);

// ---- クリック音(MP3未指定なら合成音を鳴らす) ----
// 1つのAudio要素を「止めて→頭に戻す→再生」で使い回すと、連打の速さに
// 内部のシーク処理が追いつかず、音が詰まって消えてしまう不具合があった。
//
// そこで、可能な場合は Web Audio(AudioBufferSourceNode)方式を使う。
// これは音声データを事前に読み込んでおき、鳴らす瞬間に
// 「前の音を確実に止める→新しい音を頭から鳴らす」をブラウザに
// 正確に指示できる仕組みで、連打してもこんがらがらない。
// (ファイルをブラウザで直接開く file:// の場合など、読み込みに
//  失敗することがあるので、その場合は下のプール方式に自動で切り替わる)
let audioCtx = null;
let currentOsc = null;
let clickBuffer = null;          // Web Audio方式で使う、読み込み済みの音声データ
let currentBufferSource = null;  // 現在再生中の音(次のクリックで即座に止める対象)

function ensureAudioCtx(){
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

// フォールバック用:同じ音声を複数個あらかじめ読み込んでおくプール
const AUDIO_POOL_SIZE = 12;
const audioPool = [];
let audioPoolIndex = 0;

if (CLICK_SOUND_SRC){
  for (let i = 0; i < AUDIO_POOL_SIZE; i++){
    const a = new Audio(CLICK_SOUND_SRC);
    a.preload = "auto";
    a.load();
    audioPool.push(a);
  }
  // Web Audio用に音声データの読み込み・デコードを試みる
  fetch(CLICK_SOUND_SRC)
    .then(res => res.arrayBuffer())
    .then(data => ensureAudioCtx().decodeAudioData(data))
    .then(buf => { clickBuffer = buf; })
    .catch(() => { clickBuffer = null; }); // 失敗時はプール方式のまま
}

function playClickSound(){
  // 1) Web Audio方式が使える場合:前の音を確実に止めてから鳴らす
  if (clickBuffer){
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    if (currentBufferSource){
      try { currentBufferSource.stop(); } catch(e){} // 前の音を即座に止める
    }
    const source = ctx.createBufferSource();
    source.buffer = clickBuffer;
    source.connect(ctx.destination);
    source.start(0);
    currentBufferSource = source;
    return;
  }
  // 2) フォールバック:プール方式(確実に鳴るが、前の音の完全カットは保証しない)
  if (audioPool.length){
    const a = audioPool[audioPoolIndex];
    audioPoolIndex = (audioPoolIndex + 1) % audioPool.length;
    try { a.currentTime = 0; } catch(e){}
    const p = a.play();
    if (p !== undefined) p.catch(()=>{});
    return;
  }
  // 3) MP3未指定時の合成音
  const ctx = ensureAudioCtx();
  if (currentOsc){
    try { currentOsc.stop(); } catch(e){} // 前の合成音を止める
  }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(520, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.18, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.15);
  currentOsc = osc;
}

// ---- クリックカウンター ----
let count = 0;
const countEl = document.getElementById("counter");

// ---- ランダムな場所にぱっと現れる丸(消えずに残る、ボタンの上には出さない) ----
const stage = document.getElementById("stage");
const mainBtnEl = document.getElementById("mainBtn");

function overlapsRect(x, y, size, rect, margin){
  return (
    x < rect.right + margin &&
    x + size > rect.left - margin &&
    y < rect.bottom + margin &&
    y + size > rect.top - margin
  );
}

function overlapsButton(x, y, size){
  const margin = 12; // 周りに少し余白を持たせて避ける
  return (
    overlapsRect(x, y, size, mainBtnEl.getBoundingClientRect(), margin) ||
    overlapsRect(x, y, size, countEl.getBoundingClientRect(), margin)
  );
}

function spawnPops(){
  const btnRect = mainBtnEl.getBoundingClientRect();
  const cx = btnRect.left + btnRect.width / 2;
  const cy = btnRect.top + btnRect.height / 2;

  for (let i=0; i<POPS_PER_CLICK; i++){
    const size = 56;
    let x, y, tries = 0;
    do {
      // 中央画像のまわり(近め〜そこそこ離れた場所)にランダムに出す
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 380;
      x = cx + Math.cos(angle) * dist - size / 2;
      y = cy + Math.sin(angle) * dist - size / 2;
      // 画面の外に出ないようにおさめる
      x = Math.min(Math.max(x, 0), window.innerWidth - size);
      y = Math.min(Math.max(y, 0), window.innerHeight - size);
      tries++;
    } while (overlapsButton(x, y, size) && tries < 50);

    const pop = document.createElement("div");
    pop.className = "pop";
    pop.style.left = x + "px";
    pop.style.top = y + "px";

    const img = document.createElement("img");
    img.src = popImgSrc;
    pop.appendChild(img);

    stage.appendChild(pop);
    // ※ 削除処理はしていないので、丸はずっと残ります
  }
}

document.getElementById("mainBtn").addEventListener("click", () => {
  count++;
  countEl.textContent = count + "クリック";
  playClickSound();
  spawnPops();
});
</script>

</body>
</html>
